version: 1

deployment:
  units:
    worker:
      codeRoots: [src]
      facts:
        process.restartable: true
        process.replicas: 3
        process.instances.concurrent: 3
        memory.scope: instance
        scheduling.processLocal.durable: false
        memory.processLocal.authoritative: false

providers: []

policyFiles:
  - ../policies/durable-deferred-execution.yaml
  - ../policies/replica-local-authority.yaml
  - ../policies/process-local-coordination.yaml

dispositions: []
