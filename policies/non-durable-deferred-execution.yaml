version: 1

policies:
  - id: non-durable-deferred-execution
    title: Deferred work may be lost when the process restarts
    severity: warning
    when:
      deployment:
        process.restartable: true
        scheduling.processLocal.durable: false
      code:
        kind: deferred-execution
        attributes:
          correctness.criticality: unknown
          execution.authority: process-local
    message: This deferred work may never run if the process stops or restarts first.
