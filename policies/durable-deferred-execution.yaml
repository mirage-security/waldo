version: 1

policies:
  - id: durable-deferred-execution
    title: Required deferred work may be lost when the process restarts
    severity: error
    when:
      deployment:
        process.restartable: true
        scheduling.processLocal.durable: false
      code:
        kind: deferred-execution
        attributes:
          correctness.critical: true
          execution.authority: process-local
    message: Required deferred work may never run if the process stops or restarts first.
