version: 2
service: process-local-coordination

artifacts:
  gateway:
    source: app
    entrypoint: state.ts

deployments:
  call-gateway:
    artifact: gateway
    from:
      adapter: facts
      source: deployment/single-instance.yaml
      resource: call-gateway

providers:
  - name: semgrep-typescript
    command:
      - go
      - run
      - ./cmd/waldo-semgrep-provider
      - --config
      - examples/process-local-coordination/semgrep.yaml
      - --target
      - examples/process-local-coordination/app

policyFiles:
  - ../../policies/process-local-coordination.yaml
