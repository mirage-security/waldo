version: 2
service: durable-deferred-work

artifacts:
  app:
    source: app
    entrypoint: expiry.go

deployments:
  expiry-notifier:
    artifact: app
    from:
      adapter: facts
      source: deployment/function.yaml
      resource: expiry-notifier

providers:
  - name: go-ast
    command: [go, run, ./cmd/waldo-go-ast-provider]

policyFiles:
  - ../../policies/durable-deferred-execution.yaml

dispositions: []
