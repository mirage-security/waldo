name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WALDO_REQUIRE_SEMGREP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Semgrep CE runs only embedded local rules. This job has no Semgrep
      # account token, repository secrets, write permission, or persisted Git
      # credential. The release is pinned and older than the dependency
      # cooldown recommended for CI supply-chain changes.
      - name: Install JavaScript provider backend
        run: pipx install semgrep==1.173.0
      - name: Verify JavaScript provider backend
        run: semgrep --disable-version-check --version
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/...
