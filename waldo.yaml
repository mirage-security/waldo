version: 1

deployment:
  units:
    application:
      codeRoots:
        - .
      facts:
        process.restartable: true
        process.replicas: 1
        process.instances.concurrent: 1
        memory.scope: instance
        scheduling.processLocal.durable: false
        memory.processLocal.authoritative: false

# Analyzer commands are intentionally external to Waldo core. Each provider
# receives one JSON request on stdin and emits one code fact per JSONL line.
providers: []

policyFiles:
  - policies/durable-deferred-execution.yaml
  - policies/replica-local-authority.yaml
  - policies/process-local-coordination.yaml

dispositions: []
